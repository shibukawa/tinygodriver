acceptance:
  entities-decode:
    text: >-
      with Options.Entities set, &nbsp; in text and in an attribute value decodes through AppendTo, String,
      Equal and ElementText; with it nil the reference stays as written, as today
    scope: {milestone: m1-entities-charset}
    verified_by: [entities-test]
  html-table-not-linked:
    text: >-
      a binary that imports encoding/xmlro and not the HTML entity package contains no HTML entity table
    scope: {milestone: m1-entities-charset}
    verified_by: [size-check]
  charset-hook:
    text: >-
      a declaration naming an encoding other than UTF-8 calls CharsetReader with the label and the input
      after the declaration, on the stream and on the byte-slice reader alike; with no hook it is still
      ErrEncoding
    scope: {milestone: m1-entities-charset}
    verified_by: [charset-test]
  utf16-decoded:
    text: >-
      a document with a UTF-16 byte order mark, either endian, reads the same as its UTF-8 form with no
      hook set
    scope: {milestone: m1-entities-charset}
    verified_by: [charset-test]
  office-path-unchanged:
    text: >-
      with every new option at its zero value, the zero-allocation tests of requirement:xml-office-reader
      are unchanged and the worksheet benchmarks move by a few percent at most; measured at 3 on the
      pure scan, 5 on the typed decode and 7 on shared strings
    scope: {milestone: [m1-entities-charset, m2-lenient, m3-doctype]}
    verified_by: [office-bench]
  lenient-closes:
    text: >-
      with Lenient, a missing or mismatched end tag ends the elements it leaves open and the token sequence
      matches encoding/xml with Strict false on the draw.io and MusicXML fixtures
    scope: {milestone: m2-lenient}
    verified_by: [lenient-test]
  auto-close-void:
    text: >-
      with AutoClose reporting br, a <br> without a slash is a StartElement followed by an EndElement
    scope: {milestone: m2-lenient}
    verified_by: [lenient-test]
  internal-subset-read:
    text: >-
      with AllowDoctype, the Illustrator DOCTYPE above is one Directive token, and a ] inside a quoted
      literal, a comment or a processing instruction in the subset does not end it
    scope: {milestone: m3-doctype}
    verified_by: [doctype-test]
  internal-subset-entities:
    text: >-
      &ns_svg; in the document body decodes to the value its <!ENTITY> declaration gave, and the regular
      expression in converter/image/svg.go can be deleted
    scope: {milestone: m3-doctype}
    verified_by: [doctype-test]
  no-encoding-xml-in-wasm:
    text: >-
      bdf's wasm build links neither encoding/xml nor its HTMLEntity init, and every moved site has a
      both-ways comparison test on its fixtures
    scope: {milestone: m4-types}
    verified_by: [bdf-build]
verification:
  entities-test:
    state: passed
    method: unit
    test: TestEntityTableDecodesWhatTheFiveDoNot, TestHTMLEntityTableMatchesEncodingXML, FuzzLenientReaderAgreesAcrossSources
    authority: observed
    evidence: {path: encoding/xmlro/html_test.go}
    scope: {milestone: m1-entities-charset}
  size-check:
    state: inconclusive
    method: static
    test: the table is in encoding/xmlro/htmlentity and the core package does not import it; a wasm size difference is not measured yet
    scope: {milestone: m1-entities-charset}
  charset-test:
    state: passed
    method: unit
    test: TestCharsetReaderConvertsTheRest, TestUTF16InputIsDecoded
    authority: observed
    evidence: {path: encoding/xmlro/html_test.go}
    scope: {milestone: m1-entities-charset}
  office-bench:
    state: passed
    method: unit
    test: TestSteadyStateReadingAllocatesNothing and TestEachOperationAllocatesNothing unchanged at zero; the five worksheet benchmarks 0.4 to 7 percent slower, three rounds interleaved against origin/main; see cost_to_the_office_path
    authority: observed
  lenient-test:
    state: passed
    method: unit
    test: TestLenientMatchesEncodingXMLNonStrict, FuzzLenientMatchesEncodingXML
    authority: observed
    evidence: {path: encoding/xmlro/fuzz_test.go}
    scope: {milestone: m2-lenient}
  doctype-test:
    state: passed
    method: unit
    test: TestDoctypeInternalSubsetDeclaresEntities
    authority: observed
    evidence: {path: encoding/xmlro/html_test.go}
    scope: {milestone: m3-doctype}
  bdf-build:
    state: not_run
    method: integration
    scope: {milestone: m4-types}
open_questions:
  entities-shape:
    text: >-
      Is Entities a func(name []byte) (string, bool), or a map[string]string as encoding/xml has it? Recommended
      the function: a map index on string(name) allocates under TinyGo and a function can wrap any table.
      Consequence of the map: one allocation per unknown entity on TinyGo, and the HTML table's shape is
      fixed by the core package
    state: answered
    resolution: >-
      2026-10-09, the maintainer: the function. Shipped as Options.Entities func(name []byte) (string, bool)
    scope: {milestone: m1-entities-charset}
  html-table-set:
    text: >-
      Which HTML table does the sibling package ship: the 252 names encoding/xml.HTMLEntity gives the sites
      today, or the 2,231 of HTML5? Recommended the 252 for m1, since it is what the sites decode now and
      what the comparison tests will be measured against; the HTML5 set is already in the build wherever
      x/net/html/charset is, and can be offered later as a second table
    state: answered
    resolution: >-
      2026-10-09, the maintainer said the count does not matter; the default stands: the 252 names of encoding/xml.HTMLEntity, generated from the standard library
    scope: {milestone: m1-entities-charset}
  utf16-built-in:
    text: >-
      Does the reader decode a UTF-16 byte order mark itself, or leave it to CharsetReader? Recommended
      built in: it is a fixed transform with no table, and every consumer that meets Windows-written SVG
      or XMP would otherwise write it. Consequence of the hook alone: ErrEncoding stays for those files
      unless each site wraps its input first
    state: answered
    resolution: >-
      2026-10-09, the maintainer: built in. The reader decodes a byte order mark of either order itself; CharsetReader is for declared encodings only
    scope: {milestone: m1-entities-charset}
  auto-close-shape:
    text: >-
      Is AutoClose a func(name []byte) bool, or a []string as encoding/xml.HTMLAutoClose? Recommended
      the function, with the 13-name HTML list exported next to the entity table; a slice would be searched
      per start tag with a string conversion
    state: answered
    resolution: >-
      2026-10-09, the maintainer: the function. Shipped as Options.AutoClose func(name []byte) bool with htmlentity.AutoClose
    scope: {milestone: m2-lenient}
  subset-entities-or-skip:
    text: >-
      Does m3 only skip the internal subset, or also read its <!ENTITY> declarations into the lookup?
      Recommended reading the simple internal form, <!ENTITY name "value">, since that is the whole of
      what svg.go's regular expression does and the point is to delete it; parameter entities and external
      identifiers stay ignored. Consequence of skip only: the regular expression stays and XMP keeps passing
      its own table
    state: answered
    resolution: >-
      2026-10-09, the maintainer: read the declarations. <!ENTITY name "value"> joins the table; the regular expression in converter/image/svg.go can go when bdf ports the SVG sites
    scope: {milestone: m3-doctype}
  nice-to-haves:
    text: >-
      NextAttrNS, Namespace on an EndElement, and a line number on SyntaxError are conveniences for the
      XMP port, not blockers. Decide when m3 starts, from how the XMP code reads without them
    state: deferred
    resolution: >-
      deferred to the start of m3; revisit trigger is the first XMP port attempt. Evidence needed: whether
      splitting the prefix and calling LookupNamespace reads acceptably, and whether the one warning that
      prints a line can print an offset instead
    scope: {milestone: m3-doctype}
constraints:
- Every new Options field is zero-valued off, and off costs the Office path nothing measurable.
- The HTML entity and auto-close tables live outside the core package so a consumer that does not import them does not link them.
- No external entity or DTD is ever fetched or expanded; the internal subset is read only for its literal <!ENTITY> values.
non_goals:
- A writer or an EscapeText; the only writer in the consumer is an unshipped generator.
