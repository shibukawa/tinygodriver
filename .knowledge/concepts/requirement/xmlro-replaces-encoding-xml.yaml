id: requirement:xmlro-replaces-encoding-xml
type: requirement
title: xmlro Reads What The Viewer Still Reads Through encoding/xml
summary: >-
  system:bdf moved its Office XML tree and the xlsx streams onto `encoding/xmlro` and still reads XHTML,
  EPUB, SVG, draw.io, MusicXML and XMP through `encoding/xml`, because those formats need an entity table,
  a charset hook, a lenient mode and a DOCTYPE internal subset the reader refuses today. Four additions
  to Options let the viewer carry one XML library instead of two and drop encoding/xml's init-time table
  from its wasm build.
lifecycle: accepted
facts:
  priority: should
  state: >
    proposed 2026-10-09 by the maintainer, written from the bdf side after the Office tree and the xlsx
    streams moved. The four upstream changes were implemented the same day on the branch
    claude/encoding-xml-to-xmlro-1731aa, unreleased: Options.Entities, Options.CharsetReader with
    built-in UTF-16, Options.Lenient and Options.AutoClose, and the DOCTYPE internal subset with its
    <!ENTITY> declarations, plus the sibling package encoding/xmlro/htmlentity. The consumer-side
    milestones m1 to m4 are bdf's to do
  decisions_2026_10_09:
    by: the maintainer, answering open_questions entities-shape, utf16-built-in, auto-close-shape and subset-entities-or-skip with the recommendations; html-table-set was left to the default
    entities: a func(name []byte) (string, bool), never a map
    utf16: decoded in the reader, both byte orders, with or without a CharsetReader; the declaration's label is ignored after a mark
    auto_close: a func(name []byte) bool; htmlentity.AutoClose folds ASCII case and drops a prefix, as encoding/xml compares Local names
    internal_subset: read, and <!ENTITY name "value"> joins the table ahead of Options.Entities; parameter and external entities are passed over; a value is not expanded further
    html_table: >
      the 252 names of encoding/xml.HTMLEntity, generated by htmlentity/gen.go from the standard library,
      so that the comparison tests against encoding/xml agree; the HTML5 set can be a second table later
  how_the_table_reaches_value:
    problem: >
      Value is a []byte with no way to carry a table, and the consumer decodes through Value.AppendTo and
      Value.String on Text and attribute Values. Changing Value to a struct would break every append(dst,
      v...) and len(v); reader-side decode methods would leave v.String() silently incomplete
    chosen: >
      the scanner expands table-resolved references as the token is read, into a side buffer the Value
      then aliases, with the predefined references still encoded and a value's '&' written as &amp;. So
      Text(), Attr() and NextAttr() hand out a Value whose existing methods decode the whole, ElementText
      assembles from it, and xmltree's r.Text().AppendTo and val.String() need no change. Costs a nil
      check in Text(), Name() and attrValue(), and the expansion only when a table is set and the token
      holds an '&'. Bounded by MaxBufferBytes so a declaration cannot amplify a document
  differential_fuzz_findings_2026_10_09: >
    FuzzLenientMatchesEncodingXML compares a Lenient reader with the HTML tables against encoding/xml
    with Strict false, token for token, on inputs inside the shared grammar (no directive but a DOCTYPE,
    no declaration, no byte order mark); where encoding/xml refuses a name or a character this reader
    does not check, its tokens must still be a prefix of ours. In its first minutes it found: Unescape
    swallowing the '&' after an unresolvable reference (&&#70; read as "&&#70;" instead of "&F"), a
    pre-existing bug fixed in Unescape; &#xD800; left as written where Go's rune conversion yields
    U+FFFD, aligned; a name that is only ":" or ends in ":" split into an empty local name where
    encoding/xml keeps it whole, aligned in LocalName, Prefix and htmlentity.AutoClose; and the
    reference length cap of 10 bytes in Unescape, raised to 64 so a zero-padded character reference
    decodes as there; and &#X41; with an upper-case X, which XML and encoding/xml leave as written and
    this reader decoded, aligned. Each is a seed in testdata/fuzz now. One difference is kept on
    purpose: this reader skips a UTF-8 byte order mark where encoding/xml reports it as text, so the
    comparison leaves such inputs out. After the fixes the target ran two minutes and 14.8 million
    inputs without a finding
  lenient_semantics_matched: >
    encoding/xml with Strict false unwinds one element per Token on a mismatched end tag, which makes a
    stray end tag close everything and then fail, and still reports "unexpected EOF" for a document that
    ends inside an element; its AutoClose closes a void element only when the next token is not its own
    end tag, and it also accepts an attribute without a value and an unquoted value. Lenient and AutoClose
    reproduce all of that, including a &#xD800; decoding to U+FFFD as Go's rune conversion does, which
    FuzzLenientMatchesEncodingXML checks token for token
  consumer: system:bdf
  motivation:
    one_library: >
      none of the remaining sites is hot. XHTML, EPUB package documents, SVG, draw.io files, MusicXML
      and XMP are kilobytes each, and encoding/xml reads them fine. The reason to move them is to stop
      maintaining two similar XML readers in one consumer, with two sets of bounds, two error shapes and
      two namespace stories
    wasm_size: >
      an import of encoding/xml links its package init whether or not the importer parses anything, and
      the init builds the HTMLEntity map. A file that only names xml.Attr or xml.Name pays it, so the
      type references in xmltree, drawingml, visio and xlsx have to go before the package does
    size_claim_checked: >
      observed 2026-10-09: encoding/xml's HTMLEntity has 252 entries on go1.27.0, the HTML 4 set. The
      "about 2,200" figure the proposal attributes to encoding/xml is the 2,231-entry HTML5 table of
      golang.org/x/net/html, which golang.org/x/net/html/charset depends on, and which webdoc, epub and
      the SVG rasterizer pull in through charset.NewReaderLabel. So a CharsetReader hook in xmlro removes
      that table only if the consumer also stops passing charset.NewReaderLabel; the htmlindex route
      musicxml already uses (golang.org/x/text) does not carry it. Not measured on a wasm binary yet
  remaining_sites:
    note: >
      what each site sets on its xml.Decoder, authored from the bdf branch of 2026-10-09 and checked
      against its source. Lenient means Strict = false
    svg_render:
      file: raster/imagebdf/svgparse.go
      needs: [lenient, auto_close, entities, charset]
      charset: charset.NewReaderLabel; the declaration is optional
    drawio:
      file: converter/drawio/file.go
      needs: [lenient, auto_close, entities]
      charset: a pass-through hook, so a non-UTF-8 declaration is accepted and ignored
      why_html: cell labels are HTML fragments
    drawio_stencil:
      file: converter/drawio/stencil.go
      needs: []
      shape: a plain token loop with default options; moves with the type replacement
    musicxml:
      file: converter/musicxml/input.go
      needs: [lenient, entities, charset, skip]
      charset: Latin-1 and htmlindex, declaration optional
    epub:
      file: converter/epub/package.go
      needs: [lenient, entities, charset]
      charset: its own charsetReader, which is charset.NewReaderLabel
      shape: >
        Decoder.Decode into structs with xml:",any,attr", xml:",any" and xml:",chardata" tags. The port
        reads the package document as an xmltree instead; metaNode was a generic node already
    xhtml:
      file: converter/internal/webdoc/webdoc.go
      needs: [entities, charset, comments]
      strict: true, the one site that wants mismatches reported
      charset: charset.NewReaderLabel
      shape: keeps xml.Comment tokens in the DOM it builds
    xmp:
      file: converter/internal/xmp/xmp.go
      needs: [lenient, entities, charset, namespaces]
      entities: >
        a table the caller passes: converter/image/svg.go lifts <!ENTITY name "value"> out of an
        Illustrator SVG's DOCTYPE internal subset with a regular expression, since the decoder cannot
      charset: Latin-1 and ASCII; anything else has its invalid bytes replaced
      namespaces: tells RDF elements and attributes apart by namespace URI, not prefix
    svg_size:
      file: imgconv/svg.go
      needs: [lenient]
      charset: a pass-through hook; the attributes it reads are ASCII
    offcrypto:
      file: converter/internal/offcrypto/offcrypto.go
      needs: []
      shape: xml.Unmarshal of EncryptionInfo into one struct; the port hand-writes xmlro.Decodable
    types_only:
      files: [internal/xmltree, converter/internal/ooxml/drawingml, converter/visio/text.go, converter/xlsx/chartdata.go, converter/xlsx/xlsx.go]
      needs: []
      shape: xml.Attr and xml.Name in the tree's Node and in literals that build nodes; mechanical to replace
    generator:
      file: tools/gen-drawio-stencils/main.go
      needs: []
      shape: xml.EscapeText in a code generator that is not shipped, so no writer is asked of xmlro
  what_xmlro_does_today:
    unknown_entities: >
      kept as written, which is what encoding/xml does with Strict false. There is no table to pass, so
      &nbsp; and the rest of the HTML set stay in the text as six characters
    encodings: >
      a declaration naming anything but UTF-8 is ErrEncoding, and a UTF-16 byte order mark in either
      order is refused as a document this reader does not decode
    end_tags: a mismatch is the SyntaxError "end tag does not match open element"; a missing one is ErrTruncated
    doctype: >
      AllowDoctype reports it as a Directive, but an internal subset [ ... ] is the SyntaxError "DOCTYPE
      internal subset not supported" even then
    present_already: Comment, ProcInst and CData tokens, Skip, Offset, Namespace, LookupNamespace
  upstream_changes:
    ordered_by: how many sites each one frees
    entities:
      proposal: |
        type Options struct {
            // Entities decodes the references the five predefined and the numeric
            // ones do not cover ("nbsp" -> " "). nil keeps them as written.
            Entities func(name []byte) (string, bool)
        }
      why_a_func: >
        a map[string]string would read naturally, but m[string(name)] allocates under TinyGo, see
        rule:tinygo-string-conversion-allocates, so a function, or a table searched with Equal, is the
        package's idiom
      where_it_applies: Value.AppendTo, and so String and Equal, and ElementText
      html_table: >
        the HTML set does not go in the core package. A sibling package, xmlro/htmlentity or similar,
        exports it, so only an importer that asks for it links it
      frees: [xhtml, epub, svg_render, drawio, musicxml]
    charset:
      proposal: |
        type Options struct {
            // CharsetReader wraps src once the XML declaration names an encoding
            // other than UTF-8, as encoding/xml's does.
            CharsetReader func(label string, src io.Reader) (io.Reader, error)
        }
      when: >
        at the declaration, so for a byte-slice input only the bytes after the declaration are converted.
        Without the hook ErrEncoding stays
      utf16: >
        Windows tools write SVG and XMP as UTF-16 with a byte order mark, both endians. Decoding that
        to UTF-8 in the reader itself, independent of the hook, needs no table and spares every consumer
        the same twenty lines
      frees: [xhtml, epub, svg_render, musicxml, xmp]
    lenient:
      proposal: |
        type Options struct {
            // Lenient takes a mismatched or missing end tag as the end of the
            // elements it leaves open, as encoding/xml does with Strict false.
            Lenient bool
            // AutoClose reports the elements that end with their start tag (the
            // void elements of HTML: br, img, ...).
            AutoClose func(name []byte) bool
        }
      what_strict_false_is: >
        two behaviours in encoding/xml: invent the end tags a document leaves out, and keep unknown entity
        references as written. The second is xmlro's default already, so Lenient is the first alone
      auto_close: >
        for HTML inside SVG's foreignObject and for draw.io labels. encoding/xml's HTMLAutoClose names
        13 elements: area, base, basefont, br, col, frame, hr, img, input, isindex, link, meta, param.
        A function rather than a list, for the same TinyGo reason as Entities
      frees: [svg_render, drawio, musicxml, epub, svg_size]
    doctype_internal_subset:
      proposal: >
        with AllowDoctype, read past [ ... ] respecting quotes, comments and processing instructions
        inside it, and still report one Directive. If possible, pick up <!ENTITY name "value"> declarations
        and lay them over the Entities table
      why: |
        Illustrator writes SVG with
            <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
                <!ENTITY ns_svg "http://www.w3.org/2000/svg">
                <!ENTITY ns_xlink "http://www.w3.org/1999/xlink">
            ]>
        and today converter/image/svg.go gets those with a regular expression before the decoder sees
        the file. With the reader doing it, that regular expression is deleted
      frees: [svg_render, svg_size, xmp]
    nice_to_have:
      next_attr_ns: >
        NextAttrNS() (space, local string, value Value, ok bool), resolving the attribute's prefix. XMP
        tells elements and attributes apart by RDF namespace URI, and today splits the prefix off and
        calls LookupNamespace itself
      end_element_namespace: Namespace() answering on an EndElement, not only on a StartElement
      syntax_error_line: >
        a line number on SyntaxError. Offset is enough to locate it, but one warning message in bdf prints
        encoding/xml's SyntaxError.Line
    not_needed:
      escape_text: the generator is the only writer and it is not shipped, so xmlro stays read-only
  consumer_side_work:
    types: >
      give xmltree its own Attr and Name types and replace the xml.Attr{...} literals in drawingml,
      visio, xlsx and chartdata. Mechanical, and it is what removes the last type reference
    epub: read the package document as an xmltree.ReadFrom tree instead of struct decoding
    offcrypto: one struct, so DecodeXMLFrom is written by hand per decision:xml-struct-mapping
    svg_entities: delete the <!ENTITY> regular expression once the reader reads the internal subset
  cost_to_the_office_path:
    rule: >
      with every new field at its zero value the reader must do what it does now at the speed it does
      now: Entities is consulted only after an ampersand that the predefined and numeric cases did not
      resolve, CharsetReader only at the declaration, Lenient only on a mismatch, AutoClose only when
      set. The worksheet benchmarks and TestSteadyStateReadingAllocatesNothing in requirement:xml-office-reader
      are the check
    measured_2026_10_09: >
      the first cut cost 16 percent on BenchmarkSheetScan_BytesReader, interleaved against origin/main on
      the same machine (3.50 against 4.08 ms). Bisected by building variants with each addition removed:
      the per-token checks and nil stores in next() were 7 points, the fifth int32 on attrEntry 2, the
      lenient branch in scanEndTag 1. Fixed by gathering every rare condition into one flags byte and
      every optional behaviour into one feat byte, both beside pendingEnd, so next, scanText and
      scanStartTag each test one byte; by packing the alt index into the sign of valOff; and by moving
      the mismatch and start-tag extras into calls. Final run, three rounds interleaved against
      origin/main: SheetScan_BytesReader 3.52 to 3.61 ms, SheetScan_Reader 3.52 to 3.63, SkipBody 3.85
      to 3.87, Decode_ReaderTyped 5.23 to 5.50, SstDecode 2.52 to 2.70; zero allocations unchanged. The
      decode figures moved between 3 and 7 percent across sessions, so they are the noisier ones.
      Lesson: on a 60 ns token loop, a handful of loads and nil stores is measurable, and the inliner's
      budget of 80 refuses a four-line function with one call in it, so the pop is written out at its
      two hot sites
  documentation_updated_2026_10_09:
  - the Options block in api:xml-reader
  - 'encoding/xmlro/README.md: a section on HTML-flavoured input, the Bounds and refusals list and the "Not in scope" line'
  - the well_formedness.refused line in requirement:xml-office-reader
  delivery:
    current_milestone: m1-entities-charset
    outcome: >
      XHTML and EPUB read through xmlro. XHTML first because it is Strict = true today and needs no lenient
      mode; EPUB next because its struct decoding becomes an xmltree read, which already exists
    later: draw.io and MusicXML after m2, the three SVG sites and XMP after m3, the types and offcrypto in m4
    milestones:
      m1-entities-charset:
        upstream: [entities, charset]
        consumer: [xhtml, epub]
      m2-lenient:
        upstream: [lenient]
        consumer: [drawio, musicxml]
      m3-doctype:
        upstream: [doctype_internal_subset]
        consumer: [svg_render, svg_size, xmp]
        optional_upstream: [next_attr_ns, end_element_namespace, syntax_error_line]
      m4-types:
        upstream: []
        consumer: [types_only, offcrypto, drawio_stencil]
        done_when: bdf's wasm build links no encoding/xml and no HTMLEntity init
    guard_per_site: >
      a test in the shape of TestTreesOfDocumentsMatch, reading the site's fixtures through both libraries
      and comparing, placed before the site switches
