    state: implemented
    about: capability:xmlro/entities
    scope: {milestone: m1-entities-charset}
  charset-reader:
    state: implemented
    about: capability:xmlro/charset-reader
    scope: {milestone: m1-entities-charset}
  utf16-bom:
    state: implemented
    about: capability:xmlro/utf16-bom
    scope: {milestone: m1-entities-charset}
  lenient-end-tags:
    state: implemented
    about: capability:xmlro/lenient-end-tags
    scope: {milestone: m2-lenient}
  auto-close:
    state: implemented
    about: capability:xmlro/auto-close
    scope: {milestone: m2-lenient}
  doctype-internal-subset:
    state: implemented
    about: capability:xmlro/doctype-internal-subset
    scope: {milestone: m3-doctype}
  internal-subset-entities:
    state: implemented
    about: capability:xmlro/internal-subset-entities
    scope: {milestone: m3-doctype}
