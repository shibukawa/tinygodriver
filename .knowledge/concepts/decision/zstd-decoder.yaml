id: decision:zstd-decoder
type: decision
title: compress/zstd Decodes, With A Native TinyGo Decoder
summary: >-
  `compress/zstd` gains `DecodeAll` and a streaming `Reader`, backed by klauspost on host Go and by the
  package's own decoder under TinyGo, per rule:build-tag-selection; the TinyGo decoder is what decision:fasthttp-zstd-backend
  was missing.
lifecycle: accepted
facts:
  state: accepted
  accepted_on: '2026-09-29'
  steps:
    core: v1.3.2, the decoder behind an unexported entry point
    api: this decision, DecodeAll, Reader, DecoderOption, the exported errors
    fasthttp: >-
      not yet; flipping zstdDecodeAvailable in fasthttp/zstd_tinygo.go restores BodyUnzstd and FSHandler's
      zstd
  why_native: >
    klauspost decodes in hand-written assembly TinyGo cannot link, and its noasm build cost 2.53 MB of
    binary in decision:fasthttp-zstd-backend. The native decoder adds nothing to an encode-only binary
    (16 bytes measured)
  scope:
    decodes: every RFC 8878 feature except dictionaries, including those this package's encoder never
      writes
    refuses: frames with a non-zero dictionary ID, as ErrDictionaryRequired
  api:
    one_shot: DecodeAll(dst, src, ...DecoderOption) ([]byte, error)
    stream: NewReader(r, ...DecoderOption), Read, Reset, Close
    lazy_construction: >
      NewReader reads nothing, and accepts a nil reader for pools; klauspost reads the first frame header
      at Reset, so the host backend hands it the stream at the first Read instead
    errors: >-
      io.ErrUnexpectedEOF, ErrCorrupt, ErrWindowTooLarge, ErrOutputTooLarge, ErrDictionaryRequired, ErrClosed;
      a stream's own read error passes through
    error_mapping: >
      the host backend maps klauspost's errors onto these; both of its size errors mean the window, since
      the output limit is counted outside it
  limits:
    window:
      default: 8 MiB, RFC 9659's limit for the zstd content coding
      range: 1 KiB to 1 GiB; the ceiling is the reference decoder's 32-bit limit and keeps windows an
        int on wasm
      checked: against the frame header, before decoding or allocating
      reader_memory: at most twice the window plus one block; the buffer slides the last window forward
        once full
    output:
      default: none, like compress/gzip and klauspost
      reader: returns the content up to the limit, then ErrOutputTooLarge
      host_counting: >
        counted by this package, not by klauspost, whose limit covers only its in-memory DecodeAll; klauspost
        also decodes a *bytes.Buffer whole at Reset, so the host backend hands it a plain io.Reader wrapper
  strictness:
    choice: the reference decoder's, not klauspost's
    differences: >-
      bitstreams must end exactly; blocks may not exceed min(window, 128 KiB), with a single-segment window
      equal to the content size
    consequence: the backends can disagree on a damaged frame no encoder writes, never on one an encoder
      does
  verified:
  - >-
    the zstd CLI across levels, windows and block sizes, and klauspost across every level and option,
    decoded by DecodeAll and by a Reader
  - hand-built frames for what no encoder emits, each held to the CLI's verdict
  - a black-box test file with no build tag, run against both backends
  - FuzzDecode, holding DecodeAll, Reader and klauspost to one another
  - tinygo test, including -target=wasip1 where int is 32 bits
  performance:
    tinygo_decoder_host_go: 270-450 MB/s
    tinygo_decoder_tinygo: about 250 MB/s
    host_backend: 510-960 MB/s
    allocations: none per call with warm pools, on either backend
  binary_size_tinygo_0_42_darwin_arm64:
    encode_only: 248,144 bytes, 48 more than before the decoder existed
    encode_and_decode: 340,688 bytes, so DecodeAll and Reader cost about 92 KB, bufio included
relations:
- relation: mentions
  to: decision:fasthttp-zstd-backend
  resolution: resolved
- relation: mentions
  to: rule:build-tag-selection
  resolution: resolved
